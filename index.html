<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Curiosity Voyage</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<div id="loading"><div>CARGANDO MODELOS</div><div id="loadingTrack"><div id="loadingBar"></div></div></div>
<div id="missing"></div>

<div id="intro">
  <div id="name"></div>
  <div id="prompt">Toca el logo · pulsa Enter · o escribe el código</div>
  <div id="hint2">pista: lo que te mueve es la misma palabra que el juego premia</div>
</div>
<div id="hud">
  <button id="skipToEnd" type="button">IR AL FINAL</button>
  <div id="letters"></div>
  <div id="compass" aria-label="Brújula">
    <div id="compassDial">
      <div id="compassRose">
        <span class="north">N</span><span class="east">E</span><span class="south">S</span><span class="west">O</span>
      </div>
      <div id="compassPointer"></div>
    </div>
    <div id="compassHeading">000°</div>
  </div>
  <div id="toast"></div>
  <div id="help">W / S acelerar · A / D girar<br>Espacio / Shift subir · bajar (avión y nave)<br>Arrastra para mover la cámara</div>
</div>
<div id="end">
  <div id="endName"></div>
  <div id="slogan"></div>
  <button id="replay">JUGAR DE NUEVO</button>
</div>

<script type="module" src="/src/js/main.js"></script>
</body>
</html>
